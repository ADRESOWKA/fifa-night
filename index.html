<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIFA NIGHT | Ultimate Team</title>
<style>
:root{--gold:#e7c66c;--ink:#080b12;--panel:#121a25;--muted:#aab3c2}*{box-sizing:border-box}body{margin:0;color:#f7f4ea;background:radial-gradient(ellipse at 50% -10%,#26384a 0,#111925 40%,#070a10 78%);font-family:Arial,Helvetica,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{text-align:center;padding:24px 0 30px}.eyebrow{letter-spacing:.38em;color:var(--gold);font-size:11px;font-weight:bold}.top h1{font-size:clamp(38px,8vw,76px);margin:12px 0 6px;letter-spacing:.06em;text-shadow:0 4px 24px #000}.top p{color:var(--muted);margin:0}.rule{height:1px;background:linear-gradient(90deg,transparent,#b99b54,transparent);margin:20px 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:22px}.player{display:block;color:inherit;text-decoration:none;position:relative;border:1px solid #a98d4b;border-radius:16px;overflow:hidden;background:linear-gradient(155deg,#26313b,#0a0e15 68%);box-shadow:0 14px 35px #0008;transition:.2s}.player:hover{transform:translateY(-6px);box-shadow:0 20px 45px #000b}.player img{display:block;width:100%;aspect-ratio:1199/1312;object-fit:cover}.placeholder{aspect-ratio:1199/1312;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#5a5036,#1a2029 48%,#090d14 80%);border-bottom:1px solid #b99b54}.placeholder .rating{font-size:66px;color:var(--gold);font-weight:900}.placeholder .silhouette{font-size:90px;filter:grayscale(1);opacity:.8}.placeholder .ovr{letter-spacing:.25em;color:#e8d7a5;font-size:12px}.placeholder .name{font-size:30px;letter-spacing:.12em;font-weight:900;margin-top:16px}.meta{padding:13px 15px 16px;text-align:center}.meta b{display:block;color:var(--gold);font-size:18px;letter-spacing:.1em}.meta span{display:block;color:#d5d9df;font-size:12px;margin-top:6px}.footer{text-align:center;color:#748092;font-size:11px;letter-spacing:.15em;margin-top:35px}.profile{max-width:850px;margin:0 auto}.back{color:var(--gold);text-decoration:none;display:inline-block;margin:4px 0 20px}.profilebox{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:26px;align-items:start;background:#101722;border:1px solid #927a43;border-radius:18px;padding:18px;box-shadow:0 18px 45px #0009}.profilebox img{width:100%;border-radius:10px}.pinfo h2{font-size:38px;margin:4px 0;color:var(--gold)}.ovrline{font-size:22px;font-weight:bold}.slogan{font-size:19px;margin:14px 0 22px;color:#f1e5c5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#202b39;border-radius:9px;padding:12px;text-align:center}.stat small{display:block;color:#9eacbc;font-weight:bold}.stat b{font-size:25px;color:#fff}.special{margin-top:20px;padding:14px;border-left:3px solid var(--gold);background:#1b2531;color:#f5df9e}.hidden{display:none}
/* Stadionowe wejście profilu */
.profile-intro{position:relative;isolation:isolate;overflow:hidden;text-align:center;padding:26px 12px 20px;margin:0 0 18px;border:1px solid #9b8148;border-radius:16px;background:radial-gradient(ellipse at 50% 120%,#496b62 0,#182b31 34%,#080d16 76%);animation:intro-in .75s ease both}
.profile-intro:before{content:"";position:absolute;z-index:-1;inset:-50% -20%;background:repeating-conic-gradient(from 0deg at 50% 100%,#fff0 0deg 8deg,#fff2 9deg 10deg,#fff0 12deg 20deg);animation:beams 5s linear infinite}
.profile-intro:after{content:"";position:absolute;z-index:-1;left:-20%;right:-20%;bottom:-65px;height:130px;background:radial-gradient(ellipse,#e8c76b66,transparent 68%);filter:blur(12px)}
.stadium-label{font-size:10px;letter-spacing:.42em;color:#e9d18d;font-weight:900}.intro-name{font-size:clamp(28px,7vw,54px);font-weight:1000;letter-spacing:.12em;margin:9px 0 0;text-shadow:0 0 22px #e4bf5d88}.intro-rating{display:flex;justify-content:center;align-items:baseline;gap:9px;margin:2px 0}.intro-rating strong{font-size:clamp(58px,13vw,92px);line-height:1;color:#f3d47e;text-shadow:0 0 12px #e6c66c,0 0 36px #c99539;animation:rating-pop .9s cubic-bezier(.15,1.5,.4,1) .25s both}.intro-rating span{font-size:14px;letter-spacing:.2em;color:#fff}.intro-sub{font-size:11px;color:#d7e2e1;letter-spacing:.25em}.profilebox{animation:card-reveal .85s cubic-bezier(.2,.8,.2,1) .12s both;transform-origin:50% 65%}.profilebox img,.profilebox .placeholder{box-shadow:0 0 0 1px #e9cb7a,0 0 26px #e2b95055}.special{position:relative;overflow:hidden}.special:after{content:"";position:absolute;top:-50%;bottom:-50%;left:-60%;width:35%;transform:skewX(-22deg);background:linear-gradient(90deg,transparent,#fff6,transparent);animation:shine 3.2s ease-in-out 1s infinite}.player:active{transform:scale(.98)}
@keyframes intro-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes beams{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes rating-pop{0%{opacity:0;transform:scale(.25) rotate(-12deg)}70%{opacity:1;transform:scale(1.12) rotate(2deg)}100%{transform:scale(1) rotate(0)}}@keyframes card-reveal{0%{opacity:0;transform:perspective(900px) rotateX(18deg) translateY(35px) scale(.94)}100%{opacity:1;transform:perspective(900px) rotateX(0) translateY(0) scale(1)}}@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:650px){.profilebox{grid-template-columns:1fr}.profilebox img{max-width:330px;margin:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.meta{padding:10px 7px}.meta b{font-size:15px}.profile-intro{padding:20px 8px}.intro-sub{font-size:9px}}
</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">EDYCJA SPECJALNA • 2026</div><h1>FIFA NIGHT</h1><p>Pięciu zawodników. Jedna korona. Zero litości.</p></header><div class="rule"></div><section id="home"><div class="grid" id="cards"></div><div class="footer">ULTIMATE TEAM • FRIENDS LEAGUE</div></section><section id="profile" class="profile hidden"><a class="back" href="?">← POWRÓT DO ZAWODNIKÓW</a><div id="profileContent"></div></section></main>
<script>
const players=[
{id:'tomek',name:'TOMEK',ovr:89,pos:'ST',slogan:'JEBANA FIFA',stats:{PAC:85,SHO:90,PAS:78,DRI:88,DEF:45,PHY:99},special:'TO GRA JEST ZEPSUTA',img:null},
{id:'mati',name:'MATI',ovr:91,pos:'CDM',slogan:'KURWA MAĆ',stats:{PAC:89,SHO:92,PAS:88,DRI:90,DEF:64,PHY:97},special:'KURWA MAĆ',img:'assets/mati.png'},
{id:'kamil',name:'KAMIL',ovr:76,pos:'CM',slogan:'JA W TO NIE UMIEM GRAĆ',stats:{PAC:45,SHO:32,PAS:60,DRI:25,DEF:88,PHY:99},special:'PIERWSZY RAZ GRAM',img:'assets/kamil.png'},
{id:'dawid',name:'DAWID',ovr:87,pos:'LW',slogan:'OSTATNIO GRAŁEM W FIFĘ 23',stats:{PAC:88,SHO:86,PAS:84,DRI:87,DEF:64,PHY:92},special:'W FIFIE 23 BYŁO INACZEJ',img:'assets/dawid.png'},
{id:'dyzio',name:'DYZIO',ovr:99,pos:'ST',slogan:'JESTEM KURWA NAJLEPSZY',stats:{PAC:99,SHO:99,PAS:99,DRI:99,DEF:99,PHY:99},special:'EGO WIĘKSZE NIŻ STADION',img:'assets/dyzio.png'}
];
const cards=document.getElementById('cards');
function cardArt(p){return p.img?`<img src="${p.img}" alt="Karta ${p.name}">`:`<div class="placeholder"><div class="rating">${p.ovr}</div><div class="ovr">OVR • ${p.pos}</div><div class="silhouette">⚽</div><div class="name">${p.name}</div><div class="ovr">JOKER EDITION</div></div>`}
function showHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('profile').classList.add('hidden');cards.innerHTML=players.map(p=>`<a class="player" href="?player=${p.id}">${cardArt(p)}<div class="meta"><b>${p.name}</b><span>${p.ovr} OVR • ${p.pos} • ${p.slogan}</span></div></a>`).join('')}
function showPlayer(p){document.getElementById('home').classList.add('hidden');document.getElementById('profile').classList.remove('hidden');document.getElementById('profileContent').innerHTML=`<div class="profile-intro"><div class="stadium-label">FIFA NIGHT • PLAYER WALKOUT</div><div class="intro-name">${p.name}</div><div class="intro-rating"><strong>${p.ovr}</strong><span>OVR</span></div><div class="intro-sub">${p.pos} &nbsp; • &nbsp; POLSKA &nbsp; • &nbsp; ULTIMATE TEAM</div></div><div class="profilebox">${p.img?`<img src="${p.img}" alt="Karta ${p.name}">`:`<div class="placeholder"><div class="rating">${p.ovr}</div><div class="ovr">OVR • ${p.pos}</div><div class="silhouette">⚽</div><div class="name">${p.name}</div><div class="ovr">JOKER EDITION</div></div>`}<div class="pinfo"><div class="ovrline">${p.ovr} OVR • ${p.pos}</div><h2>${p.name}</h2><div class="slogan">„${p.slogan}”</div><div class="stats">${Object.entries(p.stats).map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}</div><div class="special"><small>CECHA SPECJALNA</small><br><b>${p.special}</b></div></div></div>`}
const id=new URLSearchParams(location.search).get('player');const chosen=players.find(p=>p.id===id);if(chosen)showPlayer(chosen);else showHome();
</script></body></html>
