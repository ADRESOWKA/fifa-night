<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIFA NIGHT | Ultimate Team</title>
<style>
:root{--gold:#e7c66c;--ink:#080b12;--panel:#121a25;--muted:#aab3c2}*{box-sizing:border-box}body{margin:0;color:#f7f4ea;background:radial-gradient(ellipse at 50% -10%,#26384a 0,#111925 40%,#070a10 78%);font-family:Arial,Helvetica,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{text-align:center;padding:24px 0 30px}.eyebrow{letter-spacing:.38em;color:var(--gold);font-size:11px;font-weight:bold}.top h1{font-size:clamp(38px,8vw,76px);margin:12px 0 6px;letter-spacing:.06em;text-shadow:0 4px 24px #000}.top p{color:var(--muted);margin:0}.rule{height:1px;background:linear-gradient(90deg,transparent,#b99b54,transparent);margin:20px 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:22px}.player{display:block;color:inherit;text-decoration:none;position:relative;border:1px solid #a98d4b;border-radius:16px;overflow:hidden;background:linear-gradient(155deg,#26313b,#0a0e15 68%);box-shadow:0 14px 35px #0008;transition:.2s}.player:hover{transform:translateY(-6px);box-shadow:0 20px 45px #000b}.player img{display:block;width:100%;aspect-ratio:1199/1312;object-fit:cover}.placeholder{aspect-ratio:1199/1312;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#5a5036,#1a2029 48%,#090d14 80%);border-bottom:1px solid #b99b54}.placeholder .rating{font-size:66px;color:var(--gold);font-weight:900}.placeholder .silhouette{font-size:90px;filter:grayscale(1);opacity:.8}.placeholder .ovr{letter-spacing:.25em;color:#e8d7a5;font-size:12px}.placeholder .name{font-size:30px;letter-spacing:.12em;font-weight:900;margin-top:16px}.meta{padding:13px 15px 16px;text-align:center}.meta b{display:block;color:var(--gold);font-size:18px;letter-spacing:.1em}.meta span{display:block;color:#d5d9df;font-size:12px;margin-top:6px}.footer{text-align:center;color:#748092;font-size:11px;letter-spacing:.15em;margin-top:35px}.profile{max-width:850px;margin:0 auto}.back{color:var(--gold);text-decoration:none;display:inline-block;margin:4px 0 20px}.profilebox{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:26px;align-items:start;background:#101722;border:1px solid #927a43;border-radius:18px;padding:18px;box-shadow:0 18px 45px #0009}.profilebox img{width:100%;border-radius:10px}.pinfo h2{font-size:38px;margin:4px 0;color:var(--gold)}.ovrline{font-size:22px;font-weight:bold}.slogan{font-size:19px;margin:14px 0 22px;color:#f1e5c5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#202b39;border-radius:9px;padding:12px;text-align:center}.stat small{display:block;color:#9eacbc;font-weight:bold}.stat b{font-size:25px;color:#fff}.special{margin-top:20px;padding:14px;border-left:3px solid var(--gold);background:#1b2531;color:#f5df9e}.hidden{display:none}
/* Stadionowe wejście profilu */
.profile-intro{position:relative;isolation:isolate;overflow:hidden;text-align:center;padding:26px 12px 20px;margin:0 0 18px;border:1px solid #9b8148;border-radius:16px;background:radial-gradient(ellipse at 50% 120%,#496b62 0,#182b31 34%,#080d16 76%);animation:intro-in .75s ease both}
.profile-intro:before{content:"";position:absolute;z-index:-1;inset:-50% -20%;background:repeating-conic-gradient(from 0deg at 50% 100%,#fff0 0deg 8deg,#fff2 9deg 10deg,#fff0 12deg 20deg);animation:beams 5s linear infinite}
.profile-intro:after{content:"";position:absolute;z-index:-1;left:-20%;right:-20%;bottom:-65px;height:130px;background:radial-gradient(ellipse,#e8c76b66,transparent 68%);filter:blur(12px)}
.stadium-label{font-size:10px;letter-spacing:.42em;color:#e9d18d;font-weight:900}.intro-name{font-size:clamp(28px,7vw,54px);font-weight:1000;letter-spacing:.12em;margin:9px 0 0;text-shadow:0 0 22px #e4bf5d88}.intro-rating{display:flex;justify-content:center;align-items:baseline;gap:9px;margin:2px 0}.intro-rating strong{font-size:clamp(58px,13vw,92px);line-height:1;color:#f3d47e;text-shadow:0 0 12px #e6c66c,0 0 36px #c99539;animation:rating-pop .9s cubic-bezier(.15,1.5,.4,1) .25s both}.intro-rating span{font-size:14px;letter-spacing:.2em;color:#fff}.intro-sub{font-size:11px;color:#d7e2e1;letter-spacing:.25em}.profilebox{animation:card-reveal .85s cubic-bezier(.2,.8,.2,1) .12s both;transform-origin:50% 65%}.profilebox img,.profilebox .placeholder{box-shadow:0 0 0 1px #e9cb7a,0 0 26px #e2b95055}.special{position:relative;overflow:hidden}.special:after{content:"";position:absolute;top:-50%;bottom:-50%;left:-60%;width:35%;transform:skewX(-22deg);background:linear-gradient(90deg,transparent,#fff6,transparent);animation:shine 3.2s ease-in-out 1s infinite}.player:active{transform:scale(.98)}
@keyframes intro-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes beams{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes rating-pop{0%{opacity:0;transform:scale(.25) rotate(-12deg)}70%{opacity:1;transform:scale(1.12) rotate(2deg)}100%{transform:scale(1) rotate(0)}}@keyframes card-reveal{0%{opacity:0;transform:perspective(900px) rotateX(18deg) translateY(35px) scale(.94)}100%{opacity:1;transform:perspective(900px) rotateX(0) translateY(0) scale(1)}}@keyframes shine{0%,55%{left:-60%}100%{left:130%}}

/* WALKOUT — pełnoekranowe wejście przed kartą każdego zawodnika */
.walkout{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:#03050a;color:#f9e8b2;perspective:900px}
.walkout.fade-out{animation:walkout-exit .9s ease forwards;pointer-events:none}
.walkout-bg{position:absolute;inset:-12%;background:radial-gradient(ellipse at 50% 48%,#75501c 0,#201507 27%,#05070c 67%);animation:tunnel-push 7.8s cubic-bezier(.2,.65,.25,1) forwards}
.walkout-tunnel{position:absolute;inset:8% 18%;border:3px solid #e7bd58;transform:perspective(600px) rotateX(8deg) scale(.65);box-shadow:0 0 22px #e8b84e, inset 0 0 35px #e8b84e66;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);animation:tunnel-open 3.3s ease-out forwards}
.walkout-tunnel:before,.walkout-tunnel:after{content:"";position:absolute;inset:0;border:2px solid #ffe4a0;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);transform:scale(.82);opacity:.8}
.walkout-tunnel:after{transform:scale(.64);opacity:.45}
.walkout-beams{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 10deg,#ffd77a22 11deg 12deg,transparent 14deg 22deg);animation:beam-spin 12s linear infinite;mix-blend-mode:screen}
.walkout-floor{position:absolute;left:0;right:0;bottom:-12%;height:43%;background:linear-gradient(transparent,#e6ad3b18),repeating-linear-gradient(90deg,transparent 0 9%,#f4c45c22 9.2% 9.5%,transparent 10% 20%);transform:perspective(300px) rotateX(62deg);transform-origin:top;filter:blur(1px)}
.walkout-smoke{position:absolute;inset:45% -20% 0;background:radial-gradient(ellipse at 20% 50%,#d5d5d533,transparent 35%),radial-gradient(ellipse at 70% 45%,#eee4d133,transparent 38%);filter:blur(22px);animation:smoke-drift 5s ease-in-out infinite alternate}
.walkout-person{position:absolute;bottom:-5%;height:min(72vh,680px);width:min(55vw,470px);object-fit:cover;object-position:50% 22%;border-radius:46% 46% 8px 8px;filter:brightness(.35) contrast(1.2);opacity:0;mask-image:linear-gradient(to bottom,#000 0 78%,transparent 100%);animation:person-reveal 7.2s ease forwards}
.walkout-copy{position:absolute;z-index:3;left:50%;top:50%;width:min(92vw,900px);transform:translate(-50%,-50%);text-align:center;text-shadow:0 3px 18px #000;margin:0;padding:16px}
.walkout-kicker{font-size:clamp(10px,2vw,15px);letter-spacing:.55em;color:#ffe7a3;opacity:0;animation:copy-in .7s 1.2s forwards}
.walkout-title{font-size:clamp(38px,9vw,100px);font-weight:1000;letter-spacing:.12em;color:#f7d77f;text-shadow:0 0 12px #ffc34b,0 0 38px #c58b2d;opacity:0;transform:scale(.7);animation:title-in .9s 4.2s cubic-bezier(.15,1.4,.4,1) forwards}
.walkout-ovr{font-size:clamp(17px,3vw,30px);font-weight:900;letter-spacing:.3em;opacity:0;animation:copy-in .8s 5s forwards}
.walkout-slogan{font-size:clamp(12px,2.3vw,20px);letter-spacing:.12em;color:#fff0c2;opacity:0;animation:copy-in .8s 5.7s forwards}
.walkout-skip{position:absolute;z-index:5;right:18px;top:18px;border:1px solid #e6c16c;background:#090b10bb;color:#ffe6a2;padding:10px 15px;border-radius:30px;font-weight:bold;cursor:pointer}
@keyframes tunnel-push{0%{transform:scale(1.45)}100%{transform:scale(.92)}}
@keyframes tunnel-open{0%{opacity:.2;transform:perspective(600px) rotateX(8deg) scale(.35)}100%{opacity:1;transform:perspective(600px) rotateX(8deg) scale(1.1)}}
@keyframes beam-spin{to{transform:rotate(360deg)}}
@keyframes smoke-drift{from{transform:translateX(-4%) scale(1)}to{transform:translateX(5%) scale(1.15)}}
@keyframes person-reveal{0%,28%{opacity:0;transform:translateY(90px) scale(.9)}48%{opacity:.65;filter:brightness(.55) contrast(1.15)}72%,100%{opacity:1;filter:brightness(.95) contrast(1.05);transform:translateY(0) scale(1)}}
@keyframes copy-in{to{opacity:1}}
@keyframes title-in{to{opacity:1;transform:scale(1)}}
@keyframes walkout-exit{to{opacity:0;visibility:hidden}}
@media(max-width:650px){.walkout-person{width:82vw;height:62vh}.walkout-tunnel{inset:12% 8%}}
.walkout-placeholder{display:grid;place-items:center;font-size:clamp(120px,28vw,260px);color:#e7c66c;background:radial-gradient(ellipse,#74602c88,transparent 68%);filter:drop-shadow(0 0 30px #e7c66c)}
@media(prefers-reduced-motion:reduce){.walkout *{animation-duration:.01ms!important;animation-delay:0ms!important}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:650px){.profilebox{grid-template-columns:1fr}.profilebox img{max-width:330px;margin:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.meta{padding:10px 7px}.meta b{font-size:15px}.profile-intro{padding:20px 8px}.intro-sub{font-size:9px}}

/* EKRAN VS — przedmeczowa prezentacja dwóch zawodników */
.vs-launch{display:block;margin:0 auto 26px;padding:14px 28px;border:1px solid #f0d17a;border-radius:999px;background:linear-gradient(135deg,#e6c36c,#8e6826);color:#111;font-weight:1000;letter-spacing:.16em;font-size:14px;cursor:pointer;box-shadow:0 8px 28px #d4a94344}
.vs-launch:hover,.vs-start:hover{filter:brightness(1.12);transform:translateY(-2px)}
.vs-panel{max-width:900px;margin:0 auto 30px;padding:24px;border:1px solid #9b8148;border-radius:18px;background:linear-gradient(145deg,#182433,#080d15);box-shadow:0 18px 48px #0009;text-align:center}
.vs-panel h2{color:var(--gold);letter-spacing:.16em;margin:0 0 8px;font-size:clamp(24px,5vw,38px)}
.vs-panel>p{color:var(--muted);margin:0 0 22px}
.vs-picks{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.vs-pick{min-width:0;text-align:center}.vs-pick label{display:block;color:#e9d18d;font-size:11px;font-weight:900;letter-spacing:.22em;margin-bottom:9px}
.vs-pick select{width:100%;padding:13px 12px;border-radius:9px;border:1px solid #b99b54;background:#0b111b;color:#fff;font-size:16px;font-weight:800}
.vs-symbol{font-size:clamp(28px,6vw,54px);font-weight:1000;font-style:italic;color:#f5d47b;text-shadow:0 0 18px #d9a83b}
.vs-start{margin-top:22px;padding:14px 30px;border:1px solid #f1d78f;border-radius:8px;background:linear-gradient(120deg,#f1d78f,#9a722c);color:#10131a;font-weight:1000;letter-spacing:.18em;cursor:pointer;transition:.2s}
.vs-error{min-height:18px;color:#ffb3a8;font-size:13px;margin-top:12px}
.vs-stage{position:fixed;inset:0;z-index:10000;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#253746 0,#0a101a 48%,#020409 100%);color:#fff;display:flex;align-items:center;justify-content:center}
.vs-stage:before{content:"";position:absolute;inset:-35%;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0 9deg,#d9b75b20 10deg 11deg,transparent 13deg 22deg);animation:beam-spin 18s linear infinite}
.vs-stage:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#07101ee8 0%,transparent 40%,transparent 60%,#07101ee8 100%);pointer-events:none}
.vs-topline{position:absolute;z-index:4;top:6%;left:0;right:0;text-align:center;color:#f0d58e;font-size:clamp(10px,2vw,15px);letter-spacing:.55em;font-weight:900}
.vs-duel{position:relative;z-index:2;width:min(1100px,96vw);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(5px,2vw,24px)}
.vs-side{position:relative;min-width:0;text-align:center;animation:vs-side-in .9s cubic-bezier(.16,.9,.3,1) both}
.vs-side:last-child{animation-delay:.18s}
.vs-photo{height:min(58vh,520px);width:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 28px #d7b65c66);mask-image:linear-gradient(to bottom,#000 0 84%,transparent 100%)}
.vs-silhouette{height:min(58vh,520px);display:grid;place-items:center;font-size:clamp(110px,22vw,250px);color:#c9aa60;text-shadow:0 0 45px #d9b75b66}
.vs-player-name{font-size:clamp(22px,4.5vw,52px);font-weight:1000;letter-spacing:.12em;color:#f5d985;text-shadow:0 3px 20px #000;margin-top:-8px}
.vs-player-rating{font-size:clamp(17px,2.7vw,28px);font-weight:900;letter-spacing:.2em}
.vs-mid{position:relative;z-index:3;font-size:clamp(46px,10vw,116px);font-weight:1000;font-style:italic;color:#fff;text-shadow:0 0 10px #fff,0 0 35px #dcae45,0 0 70px #dcae45;transform:skew(-10deg);animation:vs-pulse 1.5s ease-in-out infinite alternate}
.vs-bottomline{position:absolute;z-index:4;bottom:7%;left:0;right:0;text-align:center;color:#d8dce2;font-size:clamp(10px,1.7vw,14px);letter-spacing:.3em}
.vs-close{position:absolute;z-index:6;right:18px;top:18px;border:1px solid #e6c16c;background:#090b10bb;color:#ffe6a2;padding:10px 15px;border-radius:30px;font-weight:bold;cursor:pointer}
.vs-stage.reveal .vs-mid{animation:vs-impact .65s cubic-bezier(.1,1.5,.3,1) both}
@keyframes vs-side-in{from{opacity:0;transform:translateX(-90px) scale(.88)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes vs-pulse{from{filter:brightness(.8);transform:skew(-10deg) scale(.96)}to{filter:brightness(1.4);transform:skew(-10deg) scale(1.06)}}
@keyframes vs-impact{0%{transform:skew(-10deg) scale(2.4);opacity:0}100%{transform:skew(-10deg) scale(1);opacity:1}}
@media(max-width:620px){.vs-panel{padding:18px 12px}.vs-picks{gap:7px}.vs-pick select{font-size:13px;padding:11px 5px}.vs-photo,.vs-silhouette{height:42vh}.vs-player-name{font-size:clamp(16px,5vw,27px);letter-spacing:.06em}.vs-player-rating{font-size:13px}.vs-topline{letter-spacing:.28em}.vs-bottomline{letter-spacing:.12em}}

</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">EDYCJA SPECJALNA • 2026</div><h1>FIFA NIGHT</h1><p>Pięciu zawodników. Jedna korona. Zero litości.</p></header><div class="rule"></div><section id="home"><button class="vs-launch" type="button" onclick="toggleVSPanel()">⚔  OTWÓRZ EKRAN VS  ⚔</button><div id="vsPanel" class="vs-panel hidden"><h2>PRZED MECZEM</h2><p>Wybierz dwóch zawodników i rozpocznij prezentację pojedynku na dużym ekranie.</p><div class="vs-picks"><div class="vs-pick"><label>GOSPODARZ</label><select id="vsHome"></select></div><div class="vs-symbol">VS</div><div class="vs-pick"><label>GOŚĆ</label><select id="vsAway"></select></div></div><button class="vs-start" type="button" onclick="startVS()">ROZPOCZNIJ POJEDYNEK</button><div class="vs-error" id="vsError"></div></div><div class="grid" id="cards"></div><div class="footer">ULTIMATE TEAM • FRIENDS LEAGUE</div></section><section id="profile" class="profile hidden"><a class="back" href="?">← POWRÓT DO ZAWODNIKÓW</a><div id="profileContent"></div></section></main>
<script>
const players=[
{id:'tomek',name:'TOMEK',ovr:89,pos:'ST',slogan:'JEBANA FIFA',stats:{PAC:85,SHO:90,PAS:78,DRI:88,DEF:45,PHY:99},special:'TO GRA JEST ZEPSUTA',img:null},
{id:'mati',name:'MATI',ovr:91,pos:'CDM',slogan:'KURWA MAĆ',stats:{PAC:89,SHO:92,PAS:88,DRI:90,DEF:64,PHY:97},special:'KURWA MAĆ',img:'assets/mati.png'},
{id:'kamil',name:'KAMIL',ovr:76,pos:'CM',slogan:'JA W TO NIE UMIEM GRAĆ',stats:{PAC:45,SHO:32,PAS:60,DRI:25,DEF:88,PHY:99},special:'PIERWSZY RAZ GRAM',img:'assets/kamil.png'},
{id:'dawid',name:'DAWID',ovr:87,pos:'LW',slogan:'OSTATNIO GRAŁEM W FIFĘ 23',stats:{PAC:88,SHO:86,PAS:84,DRI:87,DEF:64,PHY:92},special:'W FIFIE 23 BYŁO INACZEJ',img:'assets/dawid.png'},
{id:'dyzio',name:'DYZIO',ovr:99,pos:'ST',slogan:'JESTEM KURWA NAJLEPSZY',stats:{PAC:99,SHO:99,PAS:99,DRI:99,DEF:99,PHY:99},special:'EGO WIĘKSZE NIŻ STADION',img:'assets/dyzio.png'}
];
const cards=document.getElementById('cards');
function cardArt(p){return p.img?`<img src="${p.img}" alt="Karta ${p.name}">`:`<div class="placeholder"><div class="rating">${p.ovr}</div><div class="ovr">OVR • ${p.pos}</div><div class="silhouette">⚽</div><div class="name">${p.name}</div><div class="ovr">JOKER EDITION</div></div>`}
function showHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('profile').classList.add('hidden');cards.innerHTML=players.map(p=>`<a class="player" href="?player=${p.id}">${cardArt(p)}<div class="meta"><b>${p.name}</b><span>${p.ovr} OVR • ${p.pos} • ${p.slogan}</span></div></a>`).join('')}
function playPlayerWalkout(p){
  const overlay=document.createElement('div'); overlay.className='walkout';
  const person=p.img?`<img class="walkout-person" src="${p.img}" alt="">`:`<div class="walkout-person walkout-placeholder">⚽</div>`;
  overlay.innerHTML=`
    <div class="walkout-bg"></div><div class="walkout-beams"></div><div class="walkout-tunnel"></div>
    <div class="walkout-floor"></div><div class="walkout-smoke"></div>${person}
    <div class="walkout-copy"><div class="walkout-kicker">FIFA NIGHT • WALKOUT</div>
    <div class="walkout-title">${p.name}</div><div class="walkout-ovr">${p.ovr} OVR • POLSKA • ${p.pos}</div>
    <div class="walkout-slogan">${p.slogan}</div></div>
    <button class="walkout-skip" type="button">POMIŃ INTRO »</button>`;
  document.body.appendChild(overlay);
  let ended=false; const finish=()=>{if(ended)return;ended=true;overlay.classList.add('fade-out');setTimeout(()=>overlay.remove(),950)};
  overlay.querySelector('.walkout-skip').addEventListener('click',finish);
  setTimeout(finish,7900);
}
function showPlayer(p){document.getElementById('home').classList.add('hidden');document.getElementById('profile').classList.remove('hidden');document.getElementById('profileContent').innerHTML=`<div class="profile-intro"><div class="stadium-label">FIFA NIGHT • PLAYER WALKOUT</div><div class="intro-name">${p.name}</div><div class="intro-rating"><strong>${p.ovr}</strong><span>OVR</span></div><div class="intro-sub">${p.pos} &nbsp; • &nbsp; POLSKA &nbsp; • &nbsp; ULTIMATE TEAM</div></div><div class="profilebox">${p.img?`<img src="${p.img}" alt="Karta ${p.name}">`:`<div class="placeholder"><div class="rating">${p.ovr}</div><div class="ovr">OVR • ${p.pos}</div><div class="silhouette">⚽</div><div class="name">${p.name}</div><div class="ovr">JOKER EDITION</div></div>`}<div class="pinfo"><div class="ovrline">${p.ovr} OVR • ${p.pos}</div><h2>${p.name}</h2><div class="slogan">„${p.slogan}”</div><div class="stats">${Object.entries(p.stats).map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}</div><div class="special"><small>CECHA SPECJALNA</small><br><b>${p.special}</b></div></div></div>`}
function toggleVSPanel(){
  const panel=document.getElementById('vsPanel');panel.classList.toggle('hidden');
  if(!panel.classList.contains('hidden')){
    const options=players.map(p=>`<option value="${p.id}">${p.name} • ${p.ovr} OVR</option>`).join('');
    document.getElementById('vsHome').innerHTML=options;
    document.getElementById('vsAway').innerHTML=options;
    document.getElementById('vsHome').value='dyzio';
    document.getElementById('vsAway').value='mati';
    panel.scrollIntoView({behavior:'smooth',block:'center'});
  }
}
function startVS(){
  const home=players.find(p=>p.id===document.getElementById('vsHome').value);
  const away=players.find(p=>p.id===document.getElementById('vsAway').value);
  const error=document.getElementById('vsError');
  if(!home||!away)return;
  if(home.id===away.id){error.textContent='Wybierz dwóch różnych zawodników.';return;}
  error.textContent='';
  const side=(p)=>`<div class="vs-side">${p.img?`<img class="vs-photo" src="${p.img}" alt="${p.name}">`:`<div class="vs-silhouette">⚽</div>`}<div class="vs-player-name">${p.name}</div><div class="vs-player-rating">${p.ovr} OVR • ${p.pos}</div></div>`;
  const stage=document.createElement('div');stage.className='vs-stage';
  stage.innerHTML=`<div class="vs-topline">FIFA NIGHT • MATCHDAY</div><button class="vs-close" type="button">ZAMKNIJ ✕</button><div class="vs-duel">${side(home)}<div class="vs-mid">VS</div>${side(away)}</div><div class="vs-bottomline">${home.name}  VS  ${away.name} • NIECH WYGRA LEPSZY</div>`;
  document.body.appendChild(stage);
  requestAnimationFrame(()=>stage.classList.add('reveal'));
  const close=()=>stage.remove();stage.querySelector('.vs-close').addEventListener('click',close);
  const esc=(e)=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',esc)}};document.addEventListener('keydown',esc);
}
const id=new URLSearchParams(location.search).get('player');
const chosen=players.find(p=>p.id===id);
let walkoutOverlay=null;
function launchWalkout(){
  if(!chosen) return;
  // Nie dokładaj drugiego intro, jeśli poprzednie nadal jest widoczne.
  if(walkoutOverlay && document.body.contains(walkoutOverlay)) return;
  playPlayerWalkout(chosen);
  walkoutOverlay=document.querySelector('.walkout:last-of-type');
}
if(chosen){showPlayer(chosen);launchWalkout()}else showHome();

// NFC może ponownie aktywować już otwartą kartę przeglądarki.
// W takim przypadku strona nie zawsze ładuje się od początku.
let wasHidden=false;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){wasHidden=true;return;}
  if(wasHidden){wasHidden=false;launchWalkout();}
});
window.addEventListener('pageshow',(event)=>{
  if(event.persisted) launchWalkout();
});
</script></body></html>
